apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: discoverycallrequests.joeyguerra.com
spec:
  group: joeyguerra.com
  names:
    kind: DiscoveryCallRequest
    listKind: DiscoveryCallRequestList
    plural: discoverycallrequests
    singular: discoverycallrequest
    shortNames:
      - dcr
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [name, email, preferredDate, preferredTime, timezone]
              x-kubernetes-validations:
                - rule: "self.email.contains('@') && self.email.split('@')[1].contains('.')"
                  message: "email must contain '@' and a '.' in the domain"
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                email:
                  type: string
                  minLength: 5
                  maxLength: 320
                company:
                  type: string
                  maxLength: 200
                preferredDate:
                  type: string
                  maxLength: 10
                preferredTime:
                  type: string
                  maxLength: 5
                timezone:
                  type: string
                  maxLength: 64
                notes:
                  type: string
                  maxLength: 2000
            status:
              type: object
              properties:
                delivered:
                  type: boolean
                deliveredAt:
                  type: string
                  format: date-time
      additionalPrinterColumns:
        - name: Name
          type: string
          jsonPath: .spec.name
        - name: Email
          type: string
          jsonPath: .spec.email
        - name: Preferred
          type: string
          jsonPath: .spec.preferredDate
        - name: Delivered
          type: boolean
          jsonPath: .status.delivered
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
---
# Role and RoleBinding live here (platform) rather than in mesh-gitops because
# the apps-controller does not have RBAC management permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: discovery-call-request-creator
  namespace: apps
rules:
- apiGroups: ["joeyguerra.com"]
  resources: ["discoverycallrequests"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jbot-website-discovery-call-request-creator
  namespace: apps
subjects:
- kind: ServiceAccount
  name: jbot-website
  namespace: apps
roleRef:
  kind: Role
  name: discovery-call-request-creator
  apiGroup: rbac.authorization.k8s.io
