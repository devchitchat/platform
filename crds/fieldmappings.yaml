apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: contactformsubmissions.fieldmappings.com
spec:
  group: fieldmappings.com
  names:
    kind: ContactFormSubmission
    listKind: ContactFormSubmissionList
    plural: contactformsubmissions
    singular: contactformsubmission
    shortNames:
      - cfs
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [submitterName, email, message]
              x-kubernetes-validations:
                - rule: "self.email.contains('@') && self.email.split('@')[1].contains('.')"
                  message: "email must contain '@' and a '.' in the domain"
              properties:
                submitterName:
                  type: string
                  minLength: 1
                  maxLength: 100
                email:
                  type: string
                  minLength: 5
                  maxLength: 320
                message:
                  type: string
                  minLength: 1
                  maxLength: 2000
            status:
              type: object
              properties:
                delivered:
                  type: boolean
                deliveredAt:
                  type: string
                  format: date-time
      additionalPrinterColumns:
        - name: Submitter
          type: string
          jsonPath: .spec.submitterName
        - name: Email
          type: string
          jsonPath: .spec.email
        - name: Delivered
          type: boolean
          jsonPath: .status.delivered
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
---
# Role and RoleBinding live here (platform) rather than in mesh-gitops because
# the apps-controller does not have RBAC management permissions.
# The CRD must be applied before the fieldmappings app is deployed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: contact-form-submission-creator
  namespace: apps
rules:
- apiGroups: ["fieldmappings.com"]
  resources: ["contactformsubmissions"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fieldmappings-website-contact-form-submission-creator
  namespace: apps
subjects:
- kind: ServiceAccount
  name: fieldmappings-website
  namespace: apps
roleRef:
  kind: Role
  name: contact-form-submission-creator
  apiGroup: rbac.authorization.k8s.io
