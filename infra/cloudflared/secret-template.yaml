# DO NOT commit real values. Generate and apply manually:
#
#   kubectl create secret generic cloudflared-token \
#     --from-literal=CF_TOKEN=<your-tunnel-token>
#
# Get the token from the Cloudflare Zero Trust dashboard:
#   https://one.dash.cloudflare.com → Networks → Tunnels → <your tunnel> → Configure → Install connector
#   Copy the token value from the cloudflared install command (--token <value>)
#
# This file is a reminder of what needs to exist; the actual Secret is
# created imperatively and is not tracked in git.
