apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry-ingress
  namespace: mesh-system
spec:
  podSelector:
    matchLabels:
      app: registry
  policyTypes: [Ingress]
  ingress:
    # namespaceSelector + podSelector in the same -from entry are ANDed,
    # so each rule matches exactly one pod in one namespace.
    #
    # Port-forward (deploy scripts → host:5001) and NodePort 30500
    # (k3s kubelet image pulls) are node-level traffic and are not
    # subject to NetworkPolicy — they are unaffected by these rules.
    #
    # mesh-ci-runner: issues docker buildx build commands (pushes through buildkitd,
    # but may also pull directly for layer-existence checks).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ci
          podSelector:
            matchLabels:
              app: mesh-ci-runner
      ports:
        - port: 5000
          protocol: TCP
    # buildkitd: pushes built images directly to the registry.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ci
          podSelector:
            matchLabels:
              app: buildkitd
      ports:
        - port: 5000
          protocol: TCP
