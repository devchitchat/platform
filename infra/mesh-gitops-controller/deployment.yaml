apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mesh-gitops-controller-mesh-data
  namespace: mesh-system
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-gitops-controller
  namespace: mesh-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mesh-gitops-controller
  template:
    metadata:
      labels:
        app: mesh-gitops-controller
    spec:
      serviceAccountName: mesh-gitops-controller
      containers:
        - name: controller
          image: registry.local:5000/mesh-gitops-controller:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            # mesh sidecar serves the gitops repo over HTTPS at localhost:7979
            # mesh sidecar serves the platform repo over HTTPS at localhost:7979
            - name: GITOPS_REPO_URL
              value: https://localhost:7979/platform.git
            - name: GITOPS_REPO_BRANCH
              value: main
            # Watch all platform subdirectories; never includes mesh-gitops apps/
            - name: GITOPS_WATCH_DIRS
              value: "apps infra crds namespaces"
            - name: POLL_INTERVAL_MS
              value: "30000"
            - name: STATE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

        - name: mesh
          # mesh-node: P2P git daemon, CI disabled (this pod is not a runner)
          # Built from devchitchat/agent/Dockerfile.agent-mesh
          image: registry.local:5000/mesh-node:latest
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MESH_NODE_NAME
              value: mesh-gitops-controller
          ports:
            - containerPort: 7979
          volumeMounts:
            - name: mesh-data
              mountPath: /home/mesh/.mesh
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

      volumes:
        - name: mesh-data
          persistentVolumeClaim:
            claimName: mesh-gitops-controller-mesh-data
