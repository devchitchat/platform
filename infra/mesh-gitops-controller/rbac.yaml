apiVersion: v1
kind: Namespace
metadata:
  name: mesh-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-gitops-controller
  namespace: mesh-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mesh-gitops-controller
rules:
  - apiGroups: [""]
    resources:
      - namespaces
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["", "apps", "networking.k8s.io", "batch"]
    resources:
      - deployments
      - services
      - configmaps
      - secrets
      - ingresses
      - networkpolicies
      - serviceaccounts
      - jobs
      - cronjobs
      - persistentvolumeclaims
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "bind", "escalate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mesh-gitops-controller
subjects:
  - kind: ServiceAccount
    name: mesh-gitops-controller
    namespace: mesh-system
roleRef:
  kind: ClusterRole
  name: mesh-gitops-controller
  apiGroup: rbac.authorization.k8s.io
