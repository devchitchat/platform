apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mesh-ci-runner-mesh-data
  namespace: ci
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-ci-runner
  namespace: ci
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mesh-ci-runner
  template:
    metadata:
      labels:
        app: mesh-ci-runner
    spec:
      initContainers:
        - name: init-mesh-perms
          # Runs as root to lock down the mesh data directory before the mesh
          # container starts. 700 means only uid=1001 (mesh) can enter.
          image: alpine:3@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command: ["sh", "-c", "chown 1001:1001 /home/mesh/.mesh && chmod 700 /home/mesh/.mesh"]
          volumeMounts:
            - name: mesh-data
              mountPath: /home/mesh/.mesh

      containers:
        - name: mesh
          # mesh daemon with CI enabled + bun + docker CLI
          # Built from infra/cicd/mesh-ci-runner/Dockerfile
          image: registry.local:5000/mesh-ci-runner:latest@sha256:984ddbf7a683dda84229d4676a1a16b93aba5f1ab8a1fdcbe8dbd311d7171cd3
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: mesh-peer-config
          env:
            - name: MESH_NODE_NAME
              value: mesh-ci-runner
            # Address of the standalone buildkitd pod. Consumed by entrypoint.sh
            # to configure docker buildx and written into mesh.toml as runner.buildkit_addr.
            - name: BUILDKIT_HOST
              value: tcp://buildkitd.ci.svc.cluster.local:1234
            # Registry URL written into mesh.toml as runner.registry_url.
            # uses: image jobs push here directly; no registry-proxy sidecar.
            - name: REGISTRY_URL
              value: registry.mesh-system.svc.cluster.local:5000
          volumeMounts:
            - name: mesh-data
              mountPath: /home/mesh/.mesh
            # Client-side mTLS certs for buildkitd, generated by the buildkitd-cert-gen
            # Job and stored in the buildkitd-certs Secret.
            #
            # Per-file subPath mounts so only the client certs are visible here.
            # Server certs (server.pem, server-key.pem) are intentionally absent —
            # they live in the buildkitd pod.
            - name: buildkit-certs
              mountPath: /certs/ca.pem
              subPath: ca.pem
              readOnly: true
            - name: buildkit-certs
              mountPath: /certs/client.pem
              subPath: client.pem
              readOnly: true
            - name: buildkit-certs
              mountPath: /certs/client-key.pem
              subPath: client-key.pem
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

      volumes:
        - name: mesh-data
          persistentVolumeClaim:
            claimName: mesh-ci-runner-mesh-data
        - name: buildkit-certs
          secret:
            secretName: buildkitd-certs
            defaultMode: 0400
